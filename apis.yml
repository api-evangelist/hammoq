aid: hammoq
name: Hammoq
description: 'HAMMOQ is an AI-powered resale and recommerce platform that streamlines
  the processing and listing of secondhand goods for resellers, liquidators, thrift
  and retail organizations. Its Listing Solution turns photographs into marketplace-ready
  listings: machine vision identifies each item''s attributes and category, generative
  AI writes SEO-optimized titles and descriptions, and virtual assistants quality-check
  each listing before it is published across resale marketplaces such as eBay, Poshmark,
  Mercari, Amazon and Etsy. HAMMOQ also offers Sorting and Photography solutions and
  an Infinity AI Chrome extension that autofills item specifications during listing.
  The company raised a $24M round to tackle the growing retail-returns and used-goods
  market. Surfaced as a portfolio company of Sierra Ventures and added to the API
  Evangelist network for enrichment; HAMMOQ publishes no public API, developer portal,
  or specification at this time.'
